name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:" && echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod not tidy; run go mod tidy" && exit 1)

      - name: Check proto freshness
        run: |
          if command -v protoc &>/dev/null; then
            make proto
            git diff --exit-code pb/ || (echo "pb/ out of date; run make proto" && exit 1)
          else
            echo "protoc not installed, skipping freshness check"
          fi

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Coverage
        shell: bash
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./... 2>/dev/null || true
          go tool cover -func=coverage.out | tail -1
