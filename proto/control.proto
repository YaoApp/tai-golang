// Control stream messages for L1 Control Plane.
//
// The Control stream is a long-lived bidirectional stream on a dedicated
// HTTP/3 or HTTP/2 connection, isolated from the data plane. It carries
// node registration, heartbeat, computer management, pool adjustment,
// transfer declarations, and security management messages. Session,
// Workspace and Realtime operations are not sent on Control: the server
// opens streams on Light/Heavy connections directly.
//
// Wire format: length-prefixed Payload frames inside HTTP DATA frames.
// Every Control message has namespace "control".
syntax = "proto3";

package tai;

option go_package = "github.com/yaoapp/tai-golang/pb";

// Payload is the envelope for every command: messages on the Control stream,
// and the first frame of every Light stream and Heavy transfer. The transport
// layer routes by `namespace + kind` and does not interpret `data`.
message Payload {
  string namespace = 1; // e.g. "control", "session", "workspace"
  string kind      = 2; // Command or event name (e.g. "register", "ping", "open")
  bytes  data      = 3; // Kind-specific protobuf or JSON payload
}

// Connect is the first message of a TCP connection carrying the Tai frame
// protocol (ALPN "tai/2" or plaintext): Light over reversed HTTP/2, or Heavy.
// Control and H3 Light carry the same fields in HTTP headers instead.
message Connect {
  string node_id      = 1; // Node identifier
  string node_token   = 2; // node_token issued by the server
  string connect_type = 3; // "light" | "heavy"
}

// ConnectAck is the server response to an accepted Connect.
message ConnectAck {}

// ---------------------------------------------------------------------------
// Connection management
// ---------------------------------------------------------------------------

// Register is sent by Tai immediately after the Control stream is established.
message Register {
  string   node_id      = 1; // Unique node identifier
  string   version      = 2; // Tai binary version
  Hardware hardware     = 3; // Hardware information
  repeated string capabilities = 4; // e.g. ["session","tunnel","realtime","container"]
  repeated ContainerRuntime container_runtimes = 5; // Available container runtimes
}

// ContainerRuntime describes a container runtime available on the node.
message ContainerRuntime {
  string name    = 1; // "docker" | "podman" | "containerd" | "nsjail"
  string version = 2; // e.g. "27.1.0"
  string socket  = 3; // e.g. "/var/run/docker.sock"
}

// RegisterAck is the server response to a successful Register.
message RegisterAck {
  string     tai_id      = 1; // Server-assigned Tai identifier
  bytes      public_key  = 2; // OperationToken verification public key (PEM)
  string     key_id      = 3; // Public key identifier for rotation
  PoolConfig pool_config = 4; // Initial pool parameters
}

// Ping is sent by Tai at a 30-second interval, carrying lightweight status.
message Ping {
  int64  timestamp     = 1; // Unix timestamp (seconds)
  uint32 session_count = 2; // Active session count
  uint32 cpu_percent   = 3; // CPU usage 0-100
}

// Pong is the server response to Ping.
message Pong {
  int64      timestamp   = 1; // Echo timestamp
  PoolConfig pool_config = 2; // Optional: dynamic pool adjustment
}

// GoAway notifies Tai that the server will close the connection.
message GoAway {
  string reason          = 1; // Human-readable reason
  uint32 reconnect_after = 2; // Seconds before Tai should reconnect
}

// PoolAdjust dynamically resizes a connection pool.
message PoolAdjust {
  string pool        = 1; // "light" or "heavy"
  uint32 target_size = 2; // Desired pool size
}

// ---------------------------------------------------------------------------
// Tai-initiated transfers
//
// Tai declares the transfer on Control; the server accepts by opening a
// stream (Light) or transfer (Heavy) that carries ToolFilePull / BlobPush,
// or rejects with TransferRejected on Control.
// ---------------------------------------------------------------------------

// ToolFilePush declares a large tool-result file that Tai wants to upload.
message ToolFilePush {
  string tool_call_id = 1;
  string param_name   = 2;
  string content_type = 3;
  string filename     = 4;
  uint64 size         = 5; // Bytes
}

// BlobPull asks the server to send a blob to Tai.
message BlobPull {
  string blob_hash = 1;
}

// TransferRejected refuses a Tai-initiated transfer declaration.
message TransferRejected {
  string kind    = 1; // "tool_file_push" | "blob_pull"
  string key     = 2; // tool_call_id + param_name, or blob_hash
  string code    = 3; // e.g. "unauthorized", "quota_exceeded", "too_large"
  string message = 4;
}

// ToolFilePull is the first frame of a server-opened stream: Tai writes the
// declared file content back on the same stream.
message ToolFilePull {
  string tool_call_id = 1;
  string param_name   = 2;
}

// BlobPush is the first frame of a server-opened stream: the server pushes
// the blob content to Tai on the same stream.
message BlobPush {
  string blob_hash = 1;
}

// ---------------------------------------------------------------------------
// Hardware and pool configuration
// ---------------------------------------------------------------------------

message Hardware {
  string os            = 1; // "darwin" | "linux" | "windows"
  string arch          = 2; // "amd64" | "arm64"
  uint32 cpu_cores     = 3;
  uint64 memory_mb     = 4;
  uint64 disk_free_mb  = 5;
  repeated GPU gpus    = 6;
}

message GPU {
  string name    = 1; // e.g. "NVIDIA RTX 4090"
  uint64 vram_mb = 2; // e.g. 24576
  string driver  = 3; // e.g. "550.54.14"
}

message PoolConfig {
  // Light pool (HTTP/3 or HTTP/2 streams)
  uint32 light_min_conns         = 1; // Minimum connections (default 2)
  uint32 light_max_conns         = 2; // Maximum connections (default 8)
  uint32 light_max_streams       = 3; // Max streams per connection (default 256)
  uint32 light_idle_timeout_sec  = 4; // Idle connection reclaim (default 300)

  // Heavy pool (raw TCP)
  uint32 heavy_min_idle          = 5; // Minimum idle connections (default 2)
  uint32 heavy_max_active        = 6; // Maximum active connections (default 20)
  uint32 heavy_max_idle          = 7; // Maximum idle connections (default 6)
  uint32 heavy_idle_timeout_sec  = 8; // Idle reclaim (default 300)
  uint32 heavy_health_check_sec  = 9; // Health check interval (default 30)
}

// ---------------------------------------------------------------------------
// Server Tool synchronization
// ---------------------------------------------------------------------------

// ServerToolSync pushes the available tool list to Tai.
// Sent once after RegisterAck and again on any tool change.
message ServerToolSync {
  repeated ServerTool tools = 1;
}

// ServerTool describes a single tool available via `tai call`.
message ServerTool {
  string name         = 1; // Tool name (e.g. "search", "db.query")
  string description  = 2; // Human-readable description
  bytes  input_schema = 3; // JSON Schema for input validation
}

// ---------------------------------------------------------------------------
// Security management
// ---------------------------------------------------------------------------

// ACLSync pushes access control lists to Tai.
message ACLSync {
  repeated string computer_users = 1;
  repeated string workspaces     = 2;
}

// KeyRotation pushes a new OperationToken signing public key.
message KeyRotation {
  string kid        = 1; // Key identifier
  bytes  public_key = 2; // PEM-encoded public key
}

// CertRotation pushes a new TLS CA certificate.
message CertRotation {
  bytes ca_certificate = 1; // PEM-encoded CA certificate
}

// TokenRefresh pushes a refreshed OperationToken for a long-running session.
message TokenRefresh {
  string session_id = 1;
  string token      = 2; // New OperationToken (JWT)
}
