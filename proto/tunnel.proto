// Tunnel lifecycle messages carried on the L1 Control stream.
//
// Tunnels expose local Tai ports as externally accessible domains.
// Tai requests binding via Control stream; the server authorizes and
// assigns a domain. Traffic flows through Light pool CONNECT streams.
syntax = "proto3";

package tai;

option go_package = "github.com/yaoapp/tai-golang/pb";

// TunnelBind requests a tunnel binding (Tai -> Server, requires authorization).
message TunnelBind {
  string tunnel_id  = 1;
  string target     = 2; // e.g. "localhost:3000" or "container://ctn_abc:3000"
  string protocol   = 3; // "http" | "tcp"
  bool   tls        = 4; // Enable TLS termination
  string session_id = 5; // Optional: owning session for attribution
}

// TunnelBound confirms a successful binding (Server -> Tai).
message TunnelBound {
  string tunnel_id = 1;
  string domain    = 2; // Assigned domain (e.g. "my-app.yao.dev")
}

// TunnelRejected indicates a binding was denied (Server -> Tai).
message TunnelRejected {
  string tunnel_id = 1;
  string reason    = 2;
}

// TunnelUnbind requests tunnel removal (Tai -> Server).
message TunnelUnbind {
  string tunnel_id = 1;
}

// TunnelUnbound confirms tunnel removal (Server -> Tai).
message TunnelUnbound {
  string tunnel_id = 1;
}
