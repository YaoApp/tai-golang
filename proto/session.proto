// Session stream messages for L2 Data Plane.
//
// Each Session occupies two streams on the Light pool:
//   - Control stream: bidirectional commands and responses
//   - Data stream: Tai-to-server unidirectional event flow
//
// Both streams use length-prefixed SessionMessage frames.
// The transport layer only inspects `seq` for ordering and recovery;
// `kind` and `data` are opaque to transport.
syntax = "proto3";

package tai;

option go_package = "github.com/yaoapp/tai-golang/pb";

// SessionMessage is the unified frame for both Session Control and Data streams.
message SessionMessage {
  uint64 seq  = 1; // Monotonic sequence number (per-stream)
  string kind = 2; // Message kind (e.g. "prompt", "agent_message_chunk", "state_update")
  bytes  data = 3; // Kind-specific JSON payload
}

// ---------------------------------------------------------------------------
// Session lifecycle. The server opens streams on a Light connection; the
// first frame is a Payload { namespace: "session", kind, data }. These
// handshake messages do not consume `seq`.
// ---------------------------------------------------------------------------

// SessionData is the data of the first frame ("data") of the Session Data
// stream, which the server opens after receiving SessionOpened.
message SessionData {
  string session_id = 1;
}

// SessionOpen is the data of the first frame ("open") of the Session Control
// stream.
message SessionOpen {
  string         session_id = 1;
  string         node_id    = 2;
  string         token      = 3; // OperationToken (JWT)
  SessionRequest request    = 4;
}

// SessionClose is sent by either side to close a session.
message SessionClose {
  string session_id = 1;
  string reason     = 2;
}

// SessionResume is sent by the server after reconnection to resume a session.
message SessionResume {
  string session_id    = 1;
  string token         = 2; // Fresh OperationToken
  uint64 last_ctrl_seq = 3; // Last received Control stream seq
  uint64 last_data_seq = 4; // Last received Data stream seq
}

// SessionOpened is Tai's acknowledgment that a session is ready.
message SessionOpened {
  string session_id = 1;
  string runtime    = 2; // Actual runtime used (e.g. "agent")
  string isolation  = 3; // Actual isolation (e.g. "host", "container")
}

// SessionClosed is Tai's report that a session has ended.
message SessionClosed {
  string session_id = 1;
  string reason     = 2;
  int32  exit_code  = 3;
}

// SessionError reports a session-level error.
message SessionError {
  string session_id = 1;
  string code       = 2; // e.g. "recovery_gap", "runtime_crash"
  string message    = 3;
}

// ---------------------------------------------------------------------------
// SessionRequest — mirrors types.SessionRequest, transport-opaque fields
// use bytes (JSON passthrough).
// ---------------------------------------------------------------------------

message SessionRequest {
  string runtime                         = 1;  // "agent"
  string isolation                       = 2;  // "auto" | "host" | "container"
  uint32 idle_timeout_sec                = 3;  // Session idle timeout (seconds, default 1800)
  uint32 max_duration_sec                = 4;  // Max session duration (seconds, 0 = unlimited)
  string cwd                             = 5;  // Working directory
  repeated string additional_directories = 6;  // Shared directories
  repeated McpServer mcp_servers         = 7;  // MCP servers to attach
  string assistant_id                    = 8;  // Optional assistant identifier
  string workspace_id                    = 9;  // Optional workspace identifier
  bytes  llm                             = 10; // Providers JSON (transport passthrough)
  map<string,string> env                 = 11; // Environment variables
  bytes  config                          = 12; // Runtime-specific JSON config
  map<string,string> metadata            = 13; // User-defined metadata
  bytes  meta                            = 14; // ACP extension metadata (JSON passthrough)
}

// McpServer describes an MCP server to attach to the session.
message McpServer {
  string type                  = 1; // "stdio" | "http"
  string name                  = 2; // Server name
  string command               = 3; // stdio only: executable
  repeated string args         = 4; // stdio only: arguments
  string url                   = 5; // http: endpoint URL
  map<string,string> headers   = 6; // Optional HTTP headers
  repeated EnvVariable env     = 7; // stdio only: environment variables
  bytes  meta                  = 8; // ACP extension metadata (JSON passthrough)
}

// EnvVariable is an ACP v2 environment variable key-value pair.
message EnvVariable {
  string name  = 1;
  string value = 2;
}
