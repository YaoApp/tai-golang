syntax = "proto3";

package tai;

option go_package = "github.com/yaoapp/tai-golang/pb";

import "plugin.proto";

message RemoteToolEntry {
  string name         = 1;
  string group        = 2;
  string description  = 3;
  bytes  input_schema = 4;
  repeated Step pipeline = 5;
}

message Step {
  string use  = 1;
  string as   = 2;
  bytes  args = 3;
}

message RemoteToolGroup {
  string name        = 1;
  string description = 2;
  repeated string tools = 3;
}

message RemoteToolCall {
  string tool       = 1;
  bytes  input      = 2;
  uint32 timeout_ms = 3;
  string session_id = 4;
  string request_id = 5;
}

message RemoteToolEvent {
  string kind = 1;
  bytes  data = 2;
}

message RemoteToolResult {
  bytes           output     = 1;
  RemoteToolError error      = 2;
  string          request_id = 3;
}

message RemoteToolError {
  string code    = 1;
  string message = 2;
}

message RemoteToolSync {
  repeated RemoteToolEntry tools  = 1;
  repeated RemoteToolGroup groups = 2;
  repeated PluginEntry plugins    = 3;
}
